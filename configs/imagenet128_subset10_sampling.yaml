model:
  ckpt: checkpoints/imagenet128_subset10_unet_ddpm_cosine_vpred.pt
  use_ema: true
  image_size: 128
  in_channels: 3
  num_classes: 10
  null_label: 10
  base_channels: 128
  time_dim: 512
  use_attention: true
  attention_resolutions: [32, 16, 8]
  time_scale: 1.0

diffusion:
  timesteps: 1000
  schedule_type: cosine
  cosine_s: 0.008
  prediction_type: v_prediction
  beta_start: 0.0001
  beta_end: 0.02

sample:
  class_id: 0
  num_samples: 16
  cfg_scale: 4.0
  sampler: ddim
  ddim_steps: 250
  ddim_eta: 0.0
  clip_x0: false
  device: cuda
  upscale: 1
  padding: 2
  seed: 42

output:
  save_path: figures/imagenet128_subset10/corgi_w4.png
  config_out: results/imagenet128_cfg/sample_config_subset10_corgi_w4.json
