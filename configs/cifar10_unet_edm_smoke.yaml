project:
  name: cifar10_unet_edm_smoke
  seed: 42

model:
  base_channels: 32
  time_dim: 128
  num_classes: 10
  null_label: 10
  use_attention: true
  time_scale: 1.0

edm:
  sigma_data: 0.5
  p_mean: -1.2
  p_std: 1.2
  drop_label_prob: 0.1

train:
  epochs: 1
  batch_size: 8
  lr: 0.0002
  weight_decay: 0.0
  grad_clip: 1.0
  use_amp: false
  use_ema: true
  ema_decay: 0.999
  warmup_steps: 0
  scheduler: none
  gradient_accumulation_steps: 1
  device: cuda
  data_dir: data
  num_workers: 2
  save_every: 1000

paths:
  save_path: checkpoints/cifar10_unet_edm_smoke.pt
  log_path: results/cifar_flow/training_log_edm_smoke.csv
  config_path: results/cifar_flow/config_used_edm_smoke.json
  curve_path: figures/cifar_flow/training_curve_edm_smoke.png
