project:
  name: pets64_unet_edm_smoke
  seed: 42

data:
  dataset: pets
  data_dir: data/visual64
  image_size: 64
  download: true

model:
  base_channels: 32
  time_dim: 128
  use_attention: true
  time_scale: 1.0

edm:
  sigma_data: 0.5
  p_mean: -1.2
  p_std: 1.2
  drop_label_prob: 0.1

train:
  epochs: 1
  batch_size: 4
  lr: 0.0002
  weight_decay: 0.0
  grad_clip: 1.0
  use_amp: false
  use_ema: true
  ema_decay: 0.999
  warmup_steps: 0
  scheduler: none
  gradient_accumulation_steps: 1
  device: cuda
  num_workers: 2
  save_every: 1000

paths:
  save_path: checkpoints/visual64_pets_unet_edm_smoke.pt
  log_path: results/visual64/training_log_pets_edm_smoke.csv
  config_path: results/visual64/config_used_pets_edm_smoke.json
  curve_path: figures/visual64/training_curve_pets_edm_smoke.png
