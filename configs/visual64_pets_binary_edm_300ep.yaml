project:
  name: pets64_binary_unet_edm_visual_showcase
  seed: 42

data:
  dataset: imagefolder
  data_dir: data/visual64/pets_binary_imagefolder
  image_size: 64
  download: false

model:
  base_channels: 128
  time_dim: 512
  use_attention: true
  attention_resolutions: [16, 8]
  time_scale: 1.0

edm:
  sigma_data: 0.5
  p_mean: -1.2
  p_std: 1.2
  drop_label_prob: 0.1

train:
  epochs: 300
  batch_size: 32
  lr: 0.0002
  weight_decay: 0.0
  grad_clip: 1.0
  use_amp: true
  use_ema: true
  ema_decay: 0.999
  warmup_steps: 2000
  scheduler: cosine
  gradient_accumulation_steps: 3
  device: cuda
  num_workers: 8
  save_every: 5000

paths:
  save_path: checkpoints/visual64_pets_binary_unet_edm_300ep.pt
  log_path: results/visual64/training_log_pets_binary_edm_300ep.csv
  config_path: results/visual64/config_used_pets_binary_edm_300ep.json
  curve_path: figures/visual64/training_curve_pets_binary_edm_300ep.png
