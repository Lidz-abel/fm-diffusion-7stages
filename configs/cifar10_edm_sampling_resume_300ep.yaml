model:
  ckpt: checkpoints/cifar10_unet_edm_resume_300ep.pt
  use_ema: true

sample:
  all_classes: true
  num_per_class: 8
  cfg_scale: 2.0
  sigma_data: 0.5
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0
  num_steps: 40
  solver: heun
  device: cuda
  upscale: 4
  padding: 2

output:
  save_path: figures/cifar_flow/edm_cifar10_resume_300ep_heun40_cfg2_upscaled.png
  config_out: results/cifar_flow/sample_config_edm_cifar10_resume_300ep_heun40_cfg2.json
